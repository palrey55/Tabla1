<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Permissions-Policy" content="unload=*">
    <title>Finanzas - Gestión de Clientes</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #f0f2f5;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            padding: 24px 20px 32px 20px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #1e293b;
        }

        .sub {
            color: #475569;
            border-left: 4px solid #3b82f6;
            padding-left: 14px;
            margin-bottom: 24px;
        }

        .clientes-section {
            background: #f8fafc;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 32px;
            border: 1px solid #e2e8f0;
        }

        .clientes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .selector-cliente {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        select, input {
            padding: 10px 14px;
            border-radius: 16px;
            border: 1px solid #cbd5e1;
            font-size: 0.9rem;
            background: white;
        }

        button {
            border: none;
            padding: 10px 18px;
            border-radius: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-outline {
            background: white;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            border-radius: 16px;
        }
        .btn-outline:hover {
            background: #f1f5f9;
        }

        .btn-drive {
            background: #4285F4;
            border-radius: 16px;
        }

        .btn-save {
            background: #f59e0b;
            border-radius: 16px;
        }

        .btn-danger {
            background: #ef4444;
            border-radius: 16px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .form-card {
            background: #f8fafc;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 32px;
            border: 1px solid #e2e8f0;
        }

        .form-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
        }

        .field {
            flex: 1 1 160px;
            min-width: 130px;
            position: relative;
        }

        .field label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .field input {
            width: 100%;
        }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 16px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .autocomplete-item {
            padding: 10px 14px;
            cursor: pointer;
        }
        .autocomplete-item:hover {
            background: #f1f5f9;
        }
        .autocomplete-item.selected {
            background: #dbeafe;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        th {
            background: #f1f5f9;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #eef2ff;
        }

        .saldo-cliente {
            background: #e6f0ff;
            padding: 16px 20px;
            border-radius: 28px;
            margin: 15px 0 0 0;
            text-align: right;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .abono-row {
            background-color: #d1fae5;
        }

        .status-bar {
            background: #fff3cd;
            color: #856404;
            padding: 12px 16px;
            border-radius: 16px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            display: none;
            text-align: center;
            font-weight: 600;
        }

        footer {
            font-size: 0.7rem;
            text-align: center;
            color: #62748c;
            margin-top: 24px;
        }

        @media (max-width: 780px) {
            .form-grid {
                flex-direction: column;
            }
            th, td {
                font-size: 0.75rem;
                padding: 6px;
            }
        }
    </style>

    <script>
        const CLIENT_ID = '500323901738-e1ajtft9l912cbknrimf7mmkn7rgpim2.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/drive.file';
        let tokenClient;
        let driveAutosyncEnabled = false;

        let appData = {
            clientes: [],
            clienteActual: null,
            historialItems: [],
            detalles: {}
        };

        function mostrarEstado(mensaje, color = '#fff3cd', textColor = '#856404') {
            const bar = document.getElementById('statusBar');
            if (bar) {
                bar.textContent = mensaje;
                bar.style.background = color;
                bar.style.color = textColor;
                bar.style.display = 'block';
                if (color === '#d1fae5') {
                    setTimeout(() => { bar.style.display = 'none'; }, 4000);
                }
            }
        }

        function initGoogleAPI() {
            gapi.load('client', async () => {
                try {
                    await gapi.client.init({
                        discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
                    });
                    initGIS();
                } catch (e) {
                    console.error('Error inicializando GAPI:', e);
                }
            });
        }

        function initGIS() {
            if (typeof google !== 'undefined' && google.accounts) {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID,
                    scope: SCOPES,
                    callback: handleAuthResponse,
                });
                const btn = document.getElementById('btnConectarDrive');
                if (btn) btn.style.display = 'inline-block';

                if (localStorage.getItem('driveConnected') === 'true') {
                    tokenClient.requestAccessToken({ prompt: '' });
                }
            } else {
                setTimeout(initGIS, 500);
            }
        }

        async function handleAuthResponse(resp) {
            if (resp.error !== undefined) {
                localStorage.removeItem('driveConnected');
                throw (resp);
            }
            driveAutosyncEnabled = true;
            localStorage.setItem('driveConnected', 'true');
            const btnDrive = document.getElementById('btnConectarDrive');
            if (btnDrive) {
                btnDrive.textContent = '☁️ Drive Conectado ✓';
                btnDrive.style.background = '#10b981';
            }
            await descargarDesdeDrive();
        }

        function handleAuthClick() {
            if (tokenClient) {
                tokenClient.requestAccessToken({ prompt: 'consent' });
            } else {
                alert('Google Sign-In aún se está cargando. Intenta de nuevo en un segundo.');
            }
        }

            if (!driveAutosyncEnabled) {
                alert("Primero debes conectar con Google Drive.");
                return;
            }
            mostrarEstado("⏳ Guardando y sobrescribiendo en Google Drive...", "#e0f2fe", "#0369a1");
            try {
                const fileContent = JSON.stringify(appData);
                const fileMetadata = { name: 'tabla1_backup.json', mimeType: 'application/json' };
                const file = new Blob([fileContent], { type: 'application/json' });

                const tokenObj = gapi.auth.getToken();
                if (!tokenObj || !tokenObj.access_token) {
                    alert("Sesión expirada. Vuelve a conectar con Drive.");
                    return;
                }
                const accessToken = tokenObj.access_token;

                const response = await gapi.client.drive.files.list({
                    q: "name='tabla1_backup.json' and trashed=false",
                    fields: 'files(id, name)'
                });
                const files = response.result.files;
